# VelohNav Ops en ligne — à lancer sur une machine allumée en permanence (Umbrel, Raspberry Pi, NAS, VPS)
#   cd online && docker compose up -d        →  http://<machine>:8790
services:
  velohnav-ops:
    build:
      context: ..                    # racine du dépôt : l'image compile aussi le banc (sim/, src/)
      dockerfile: online/Dockerfile
    image: velohnav-ops-online
    restart: unless-stopped
    ports:
      - "8790:8790"
    volumes:
      - ./data:/data                 # ce que le serveur apprend : vn_*.bin, archive/, historique/, prevision/, banc/
    environment:
      VN_NAME: "VelohNav Ops en ligne"
      # VN_TOKEN: "un-jeton-long"    # à définir si le port est exposé hors du réseau local
      # VN_REFRESH_S: "60"           # période de station_status (30 s au moins), comme sur la carte
      # VN_ARCHIVE_HOURS: "6,18"     # instantanés pour le banc --reel (heure de Luxembourg) ; vide = aucun
      # VN_ARCHIVE_KEEP_DAYS: "0"    # 0 = tout garder
      # VN_NIGHT_AT: "03:30"         # tâches de nuit : notes des prévisions de la veille, banc sur l'archive
      # Notifications (aussi réglables depuis la page, onglet Notifications) :
      # VN_NTFY_URL: "https://ntfy.sh/un-sujet-difficile-a-deviner"
      # VN_NTFY_TOKEN: ""            # serveur ntfy protégé
      # VN_PUBLIC_URL: "http://umbrel.local:8790"   # ouvert en touchant une notification
      # VN_NOTIFY_DIGEST: "07:30"    # résumé du matin ; vide = aucun
