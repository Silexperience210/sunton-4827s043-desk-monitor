name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32-4827s043c, esp32-4827s043r]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      # Fusion + contrôle de l'image flashable à 0x0 : c'est ce fichier qui est
      # publié dans dist/, et un en-tête bootloader en QIO le rend inutilisable
      # (le ROM ne sait pas le lire, la carte boucle sur un chien de garde).
      - name: Image fusionnée (${{ matrix.env }})
        run: |
          python3 tools/merge_dist.py --build .pio/build/${{ matrix.env }} --out dist-build/${{ matrix.env }}.bin
          python3 tools/check_dist_bin.py dist-build/${{ matrix.env }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-bin
          path: dist-build/

  # Contrôle des images réellement publiées dans dist/ (toutes versions confondues).
  binaires-publies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle structurel des dist/*.bin
        run: python3 tools/check_dist_bin.py dist/*.bin

  # Démarrage réel du firmware ESP32-S3 dans l'émulateur QEMU d'Espressif :
  # le test échoue si le démarrage n'atteint pas « [boot] prêt » ou s'il y a un plantage.
  demarrage-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e test-qemu
      - name: QEMU ESP32-S3 (Espressif)
        run: |
          # libsdl2 est une dépendance à l'édition de liens du binaire QEMU :
          # sans elle il ne démarre pas du tout, même en -nographic.
          sudo apt-get install -y libslirp0 libsdl2-2.0-0 >/dev/null
          curl -sSL -o qemu.tar.xz https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20250817/qemu-xtensa-softmmu-esp_develop_9.2.2_20250817-x86_64-linux-gnu.tar.xz
          mkdir -p "$HOME/qemu" && tar -xf qemu.tar.xz -C "$HOME/qemu"
      - name: Test de démarrage
        run: python3 tools/qemu_boot_test.py --qemu "$HOME/qemu/qemu/bin/qemu-system-xtensa" --build .pio/build/test-qemu --out qemu_out --seconds 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demarrage-qemu
          path: qemu_out/

  simulateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances (LVGL 8.3.11, ArduinoJson 7)
        run: |
          git clone -b v8.3.11 --depth 1 https://github.com/lvgl/lvgl.git .deps/lvgl
          git clone -b v7.4.2 --depth 1 https://github.com/bblanchon/ArduinoJson.git .deps/ArduinoJson
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests du cœur + audit tactile + premiers démarrages
        run: |
          cd sim
          make -j4 sim test_core bench_prevision dump_sim
          ./test_core ../docs/donnees
          ./sim ../docs/donnees /tmp/captures
          ./sim ../docs/donnees /tmp/boot boot
          ./sim ../docs/donnees /tmp/boot_wifi_ko boot-wifi-ko
          ./sim ../docs/donnees /tmp/hors_ligne hors-ligne
      # Scénarios annoncés par les rapports (code ≠ 0 au premier écart), et un nom inconnu doit échouer
      - name: Scénarios ops et service
        run: |
          cd sim
          ./sim ../docs/donnees /tmp/ops ops
          ./sim ../docs/donnees /tmp/service service
          if ./sim ../docs/donnees /tmp/inconnu nimporte-quoi; then echo "un scénario inconnu passe" && exit 1; fi
      - name: Vidage série simulé, banc réel, sauvegarde LittleFS
        run: |
          pip install pyserial
          python3 tools/test_carte_dump.py
          python3 tools/test_bench_reel.py
          python3 tools/test_sauvegarde_littlefs.py

  # Version en ligne : moteurs WebAssembly reconstruits depuis src/, réplication serveur ⇄ jumeau au bit près,
  # la synchro du firmware (sim/sync_sim, même code que la carte) contre le vrai serveur, l'historique long,
  # la note des prévisions, les notifications, le banc de nuit et l'image Docker.
  en-ligne:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dépendances (LVGL 8.3.11, ArduinoJson 7, lld)
        run: |
          git clone -b v8.3.11 --depth 1 https://github.com/lvgl/lvgl.git .deps/lvgl
          git clone -b v7.4.2 --depth 1 https://github.com/bblanchon/ArduinoJson.git .deps/ArduinoJson
          sudo apt-get install -y lld >/dev/null
      - name: Moteurs WebAssembly (clang + wasi-sysroot)
        run: bash online/engine/build.sh
      - name: Réplication serveur ⇄ jumeau
        run: node online/test/replication.test.mjs
      - name: Synchro de bout en bout (carte simulée ⇄ serveur)
        run: |
          make -C sim -j4 sync_sim
          node online/test/sync.e2e.mjs
      - name: Historique long, erreur des prévisions, notifications, banc de nuit
        run: |
          make -C sim -j4 bench_prevision
          node online/test/features.test.mjs
      - name: Image Docker (serveur + banc natif compilé sous Alpine)
        run: |
          docker build -f online/Dockerfile -t velohnav-ops-online .
          docker run --rm --entrypoint /opt/banc/sim/bench_prevision velohnav-ops-online --jours 2 --court > /tmp/banc.md
          head -5 /tmp/banc.md
