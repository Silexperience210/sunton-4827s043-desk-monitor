; ── VelohNav Ops — PlatformIO ─────────────────────────────────────────
; Carte : Sunton ESP32-4827S043 (ESP32-S3-WROOM-1 N16R8 : 16 Mo flash, 8 Mo PSRAM OPI)
;   esp32-4827s043c → tactile capacitif GT911 (version « C », la plus courante)
;   esp32-4827s043r → tactile résistif XPT2046 (version « R »)
; Flash :  pio run -e esp32-4827s043c -t upload   ·   moniteur : pio device monitor

[platformio]
default_envs = esp32-4827s043c
src_dir = src
include_dir = include

[env]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=1
    -O2
build_unflags = -Os

[env:esp32-4827s043c]
build_flags = ${env.build_flags} -DVN_TOUCH_GT911=1

[env:esp32-4827s043r]
build_flags = ${env.build_flags} -DVN_TOUCH_XPT2046=1

; Variante 8 Mo flash + PSRAM quad (révision plus ancienne). À flasher si le
; série affiche « PSRAM absente » avec l'environnement OPI ci-dessus.
[env:esp32-4827s043c-qspi]
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags = ${env.build_flags} -DVN_TOUCH_GT911=1

; Variante montée tête en bas (rotation logicielle 180°)
[env:esp32-4827s043c-180]
build_flags = ${env.build_flags} -DVN_TOUCH_GT911=1 -DVN_ROTATE_180=1

; Test automatique de démarrage dans l'émulateur QEMU ESP32-S3 (CI) — NE PAS flasher sur la carte.
; QEMU n'émule ni la PSRAM octale (on utilise la PSRAM « quad »), ni le LEDC du rétroéclairage.
[env:test-qemu]
board_build.arduino.memory_type = qio_qspi
build_flags = ${env.build_flags} -DVN_TOUCH_GT911=1 -DVN_QEMU=1
